name: Android Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g"

jobs:
  build:
    name: Debug build, tests and release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Gradle configuration check
        run: ./gradlew --no-daemon projects --console=plain

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest --console=plain --stacktrace

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --console=plain --stacktrace

      - name: Verify APK exists and is not empty
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "APK missing at $APK"; exit 1; }
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 100000 || { echo "APK is suspiciously small"; exit 1; }

      - name: Verify APK package name
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          PACKAGE=$(apkanalyzer manifest application-id "$APK")
          echo "APK package: $PACKAGE"
          test "$PACKAGE" = "com.nigutu.app" || { echo "Unexpected package name"; exit 1; }

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nigutu-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cat > RELEASE_NOTES.md <<EOF
          ## Nigutu Debug Build

          - **Version:** 1.0.0 (debug)
          - **Build date:** $(date -u +"%Y-%m-%d %H:%M UTC")
          - **Commit:** \`${GITHUB_SHA}\`
          - **Variant:** debug (unsigned debug key)
          - **Unit tests:** passed (\`./gradlew testDebugUnitTest\`)
          - **Package:** com.nigutu.app

          ### Installation
          1. Download \`Nigutu-debug.apk\` below.
          2. Allow installation from unknown sources for your browser or file manager.
          3. Install and open Nigutu, then grant audio access to build your library.

          ### Known limitations
          - Online catalog playback uses 30-second previews from the public Deezer API.
          - Equaliser availability depends on the device audio stack.
          - Instrumentation and Compose UI tests were not executed in CI (no emulator).
          - The APK is debug-signed and intended for testing only.
          EOF
          cat RELEASE_NOTES.md

      - name: Create GitHub prerelease with APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.0-debug.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cp app/build/outputs/apk/debug/app-debug.apk Nigutu-debug.apk
          gh release create "$TAG" Nigutu-debug.apk \
            --title "Nigutu Debug Build" \
            --prerelease \
            --notes-file RELEASE_NOTES.md
          gh release view "$TAG" --json tagName,isPrerelease,assets --jq '.assets[].name'

      - name: Verify release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v1.0.0-debug.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Release assets: $ASSETS"
          echo "$ASSETS" | grep -q "Nigutu-debug.apk" || { echo "APK asset missing from release"; exit 1; }
          gh release view "$TAG" --json url --jq '.url'
